# Pre-commit configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        name: check-yaml
        description: Validate YAML files syntax
        types: [yaml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: gitleaks
        description: Detect secrets with gitleaks
        entry: gitleaks detect
        args:
          - --source=.
          - --config=.gitleaks.toml
          - --verbose
          - --redact
          - --exit-code=1
        language: system
        stages: [commit, push]
        types: [text]
        exclude: ^(\.env-example|\.gitleaks\.toml|INSTALL\.md|README\.md|docs/.*\.md)$

