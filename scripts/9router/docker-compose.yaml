x-common: &common
  restart: unless-stopped
  stop_grace_period: 10s
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-service-master: &service-master
  <<: *common
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

x-service-slave: &service-slave
  <<: *common
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.5"
      reservations:
        memory: 128M
        cpus: "0.125"

services:
  # ──────────────────────────────────────────────
  # 9Router — Free AI API Gateway
  # API:       http://127.0.0.1:20128/v1
  # Dashboard: http://127.0.0.1:20128/dashboard
  # ──────────────────────────────────────────────
  9router-master:
    <<: *service-master
    image: decolua/9router:${NINEROUTER_TAG:-latest}
    container_name: clawbox-9router-master
    pull_policy: missing
    ports:
      - "${ROUTER_PORT_MASTER:-20128}:20128"
    volumes:
      - ./data/9router/master:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "${ROUTER_PORT_MASTER:-20128}"
      HOSTNAME: 0.0.0.0
      ROLE: master
      JWT_SECRET: "${JWT_SECRET:-P4s5w0rd}"
      INITIAL_PASSWORD: "${INITIAL_PASSWORD:-123456}"
    networks:
      - clawbox-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:20128/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  9router-slave-001:
    <<: *service-slave
    image: decolua/9router:${NINEROUTER_TAG:-latest}
    container_name: clawbox-9router-slave-001
    pull_policy: missing
    ports:
      - "${ROUTER_PORT_SLAVE_001:-20129}:20129"
    volumes:
      - ./data/9router/slave/001:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "${ROUTER_PORT_SLAVE_001:-20129}"
      HOSTNAME: 0.0.0.0
      ROLE: slave
      JWT_SECRET: "${JWT_SECRET:-P4s5w0rd}"
      INITIAL_PASSWORD: "${INITIAL_PASSWORD:-123456}"
    networks:
      - clawbox-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:20129/v1/models"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s

  9router-slave-002:
