x-common: &common
  restart: unless-stopped
  stop_grace_period: 10s
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

x-service-standalone: &service-standalone
  <<: *common
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.25"

services:
  9router-standalone:
    <<: *service-standalone
    image: decolua/9router:${NINEROUTER_TAG:-latest}
    container_name: sbx-9router-standalone
    pull_policy: missing
    ports:
      - "${ROUTER_PORT_STANDALONE:-20128}:20128"
    volumes:
      - 9router-standalone-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--timeout=5", "http://127.0.0.1:20128/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      DATA_DIR: /app/data
      PORT: "${ROUTER_PORT_STANDALONE:-20128}"
      MACHINE_ID_SALT: $(openssl rand -hex 32)
      HOSTNAME: 0.0.0.0
      ROLE: master
      JWT_SECRET: "${JWT_SECRET:-P4s5w0rd}"
      INITIAL_PASSWORD: "${INITIAL_PASSWORD:-123456}"
      HTTP_PROXY: "${TOR_SOCKS_URL:-socks5://sbx-tor:9050}"
      HTTPS_PROXY: "${TOR_SOCKS_URL:-socks5://sbx-tor:9050}"
      ALL_PROXY: "${TOR_SOCKS_URL:-socks5://sbx-tor:9050}"
      NO_PROXY: "${TOR_NO_PROXY:-localhost,127.0.0.1}"
    networks:
      - sbx-net

volumes:
  9router-standalone-data:

networks:
  sbx-net:
    name: sbx-net
    driver: bridge
