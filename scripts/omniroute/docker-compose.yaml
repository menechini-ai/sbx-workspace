x-common: &common
  restart: unless-stopped
  stop_grace_period: 40s
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-service-omniroute: &service-omniroute
  <<: *common
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "0.5"
      reservations:
        memory: 256M
        cpus: "0.1"

services:
  # ──────────────────────────────────────────────
  # OmniRoute — Free AI API Gateway
  # API:       http://127.0.0.1:20229/v1
  # Dashboard: http://127.0.0.1:20228
  # ──────────────────────────────────────────────
  omniroute:
    <<: *service-omniroute
    image: diegosouzapw/omniroute:${OMNIROUTER_TAG:-latest}
    container_name: clawbox-omniroute
    pull_policy: missing
    ports:
      - "${OMNIROUTE_PORT_DASHBOARD:-20228}:20228"
      - "${OMNIROUTE_PORT_API:-20229}:20229"
    volumes:
      - ./data/omniroute:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20228"
      API_PORT: "20229"
      API_HOST: "0.0.0.0"
      HOSTNAME: "0.0.0.0"
      JWT_SECRET: "${OMNIROUTE_JWT_SECRET}"
      API_KEY_SECRET: "${OMNIROUTE_API_KEY_SECRET}"
      INITIAL_PASSWORD: "${OMNIROUTE_INITIAL_PASSWORD:-CHANGEME}"
      NODE_ENV: "production"
      NODE_OPTIONS: "--max-old-space-size=384"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
