services:
  # Servidor de Memória Longa do Akita
  ai-memory:
    image: akitaonrails/ai-memory:latest
    container_name: ai-memory
    restart: unless-stopped
    ports:
      - "49374:49374"
    volumes:
      - ai-memory-data:/data
    environment:
      - AI_MEMORY_AUTH_TOKEN=${AI_MEMORY_AUTH_TOKEN}
      - AI_MEMORY_LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-8}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - ai_network

  # Container do OpenCode Automatizado e com Git
  opencode:
    build:
      context: ./scripts/opencode
      dockerfile: Dockerfile
    container_name: opencode
    restart: "no"
    environment:
      # Chaves e Endpoints da API
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-8}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL:-claude-opus-4-8}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-claude-sonnet-4-8}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-claude-haiku-4-8}
      - AI_MEMORY_SERVER_URL=${AI_MEMORY_SERVER_URL:-http://ai-memory:49374}
      - AI_MEMORY_AUTH_TOKEN=${AI_MEMORY_AUTH_TOKEN}
    volumes:
      # Workspace do projeto
      - .:/workspace
      - ~/.gitconfig:/root/.gitconfig:ro
      - opencode_config:/home/node/.config/opencode
    working_dir: /workspace
    tty: true
    stdin_open: true
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - ai_network
    depends_on:
      - ai-memory

  # Container do Claude Code Automatizado e com Git
  claude-code:
    build:
      context: ./scripts/claude-code
      dockerfile: Dockerfile
    container_name: claude-code
    restart: "no"
    environment:
      # Chaves e Endpoints da API
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-8}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL:-claude-opus-4-8}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-claude-sonnet-4-8}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-claude-haiku-4-8}
      - CLAUDE_CODE_MAX_CONTEXT_TOKENS=100000
      - CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT=1
      - AI_MEMORY_SERVER_URL=${AI_MEMORY_SERVER_URL:-http://ai-memory:49374}
      - AI_MEMORY_AUTH_TOKEN=${AI_MEMORY_AUTH_TOKEN}
    volumes:
      - ./workspace:/workspace
      - .claude:/workspace/.claude:rw
      - claude_config:/home/node/.claude
    working_dir: /workspace
    tty: true
    stdin_open: true
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - ai_network
    depends_on:
      - ai-memory

volumes:
  claude_config:
  opencode_config:
  ai-memory-data:

networks:
  ai_network:
    driver: bridge

